# ---------------------------------------------------------------------------
# Reusable workflow: mne_acq under sanitizers
# Called by pull-request.yml, staging.yml and main.yml.
# Builds mne_acq and its tests with ThreadSanitizer, and with Address- plus
# UndefinedBehaviorSanitizer (they cannot be combined), and runs each test
# several times. Any finding fails the job.
# ---------------------------------------------------------------------------
name: Reusable Sanitizers

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  Sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        sanitize: ["thread", "address,undefined"]

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    # Ubuntu 24.04 kernels randomise 32 bits of mmap addresses, which TSan and ASan cannot map around.
    - name: Allow sanitizer shadow memory
      run: sudo sysctl vm.mmap_rnd_bits=28

    # The FIFF library links mne_utils, which needs Qt Gui and therefore OpenGL headers.
    - name: Install system dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -q
        sudo apt-get install -q libgl1-mesa-dev libxkbcommon-dev

    - name: Load external dependency versions
      shell: bash
      run: ./scripts/ci/load_external_deps.sh max

    - name: Download Qt toolchain
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind qt \
          --version "$QT_BUILD_VERSION" \
          --linkage dynamic \
          --output-dir "$RUNNER_TEMP/qt"

    - name: Download Eigen
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/eigen"

    # The recorder test reads its recordings back with mne-python, mne-bids and the BIDS validator.
    - name: Install MNE-Python, MNE-BIDS and the BIDS validator
      run: python3 -m pip install --quiet mne==1.11.0 numpy==2.2.6 scipy==1.15.3 mne-bids==0.20.0 bids-validator-deno==3.0.2

    - name: Build
      run: |
        cmake -S scripts/ci/sanitizers -B build-sanitize \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qt" \
          -DMNE_SANITIZE="${{ matrix.sanitize }}"
        cmake --build build-sanitize -j "$(nproc)"

    - name: Run tests (5 repetitions)
      env:
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:strict_init_order=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        QT_QPA_PLATFORM: offscreen
      run: |
        export LD_LIBRARY_PATH="$RUNNER_TEMP/qt/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        ctest --test-dir build-sanitize --output-on-failure --repeat until-fail:5 --timeout 600
